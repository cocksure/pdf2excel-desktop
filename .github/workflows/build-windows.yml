name: Build Windows EXE

on: [push]

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --hidden-import=pdfplumber --hidden-import=pdfminer --hidden-import=openpyxl gui.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: pdf2excel-windows
          path: dist/gui.exe